name: liverestro_sales
description: "LiveRestro Sales - Enterprise SFA Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  go_router: ^14.2.0

  # Network & API
  dio: ^5.5.0+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.2
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # UI, Fonts & Design System
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0

  # Localization & Utils
  intl: ^0.20.2
  logger: ^2.4.0
  connectivity_plus: ^6.0.3

  # Device & Services
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2

  # Firebase Placeholders
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  firebase_messaging: ^15.0.3
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  speech_to_text: ^7.4.0
  google_mlkit_text_recognition: ^0.13.0
  pdf: ^3.11.1
  printing: ^5.13.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/vectors/
