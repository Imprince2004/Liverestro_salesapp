services:
  - type: web
    name: liverestro-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: liverestro-db
          property: connectionString

databases:
  - name: liverestro-db
    databaseName: liverestro
    user: liverestro_user
    plan: free
