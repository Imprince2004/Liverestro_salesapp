services:
  postgres:
    image: postgres:16-alpine
    container_name: liverestro_db
    restart: always
    environment:
      POSTGRES_DB: liverestro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: \
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liverestro"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liverestro_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:\@postgres:5432/liverestro
      PG_SSL: "false"
      JWT_SECRET: \
      JWT_REFRESH_SECRET: \
      DB_POOL_MAX: 25
      DB_POOL_MIN: 4
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONN_TIMEOUT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs

volumes:
  pgdata:
